services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fsp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fsp_local_password}
      POSTGRES_DB: fsp
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fsp -d fsp"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://fsp:${POSTGRES_PASSWORD:-fsp_local_password}@db:5432/fsp
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
  uploads:
